<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Atiq Ahmed Reza profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="photoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="photoClip">
      <circle cx="1080" cy="180" r="92"/>
    </clipPath>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="200" cy="60" rx="220" ry="120" fill="url(#glow)"/>
  <ellipse cx="900" cy="320" rx="280" ry="140" fill="url(#glow)"/>

  <rect x="40" y="40" width="1200" height="280" rx="28" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" filter="url(#softShadow)"/>
  <rect x="40" y="40" width="8" height="280" rx="4" fill="url(#accent)"/>

  <circle cx="88" cy="88" r="26" fill="#3178C6" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="88" y="95" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">TS</text>
  <circle cx="146" cy="88" r="26" fill="#61DAFB" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="146" y="95" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">R</text>
  <circle cx="204" cy="88" r="26" fill="#ffffff" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="204" y="95" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">Nxt</text>
  <circle cx="262" cy="88" r="26" fill="#339933" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="262" y="95" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">N</text>
  <circle cx="320" cy="88" r="26" fill="#47A248" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="320" y="95" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">DB</text>

  <text x="88" y="145" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600">&lt;/&gt;</text>

  <text x="640" y="132" text-anchor="middle" fill="url(#accent)" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
    Turning ideas into clean, scalable web apps
  </text>
  <text x="640" y="178" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">
    Atiq Ahmed Reza · Web Developer · CSE Student
  </text>
  <text x="640" y="214" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="17">
    Rajshahi, Bangladesh
  </text>

  <text x="640" y="252" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="16">
    atiqahmedreza@gmail.com  ·  atiq-portfolio-pearl.vercel.app
  </text>

  <rect x="320" y="272" width="640" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="640" y="295" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="500">
    React · Next.js · TypeScript · Node.js · Express · MongoDB
  </text>

  <circle cx="1080" cy="180" r="98" fill="none" stroke="url(#photoRing)" stroke-width="6"/>
  <circle cx="1080" cy="180" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <image
    xlink:href="https://raw.githubusercontent.com/atiqahmedreza/atiqahmedreza/main/assets/profile.png"
    href="https://raw.githubusercontent.com/atiqahmedreza/atiqahmedreza/main/assets/profile.png"
    x="988"
    y="88"
    width="184"
    height="184"
    clip-path="url(#photoClip)"
    preserveAspectRatio="xMidYMid slice"
  />
</svg>
